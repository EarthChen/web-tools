name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web-tools
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build web-tools
        run: pnpm build

      # --- Build photo-tools (from private repo) ---
      - name: Checkout photo-tools
        uses: actions/checkout@v4
        with:
          repository: EarthChen/photo-tools
          token: ${{ secrets.PHOTO_TOOLS_TOKEN }}
          path: _photo-tools

      - name: Install photo-tools dependencies
        run: pnpm install
        working-directory: _photo-tools

      - name: Build photo-tools
        run: pnpm exec vite build --base=/web-tools/photo-tools/
        working-directory: _photo-tools/web

      # --- Combine both build outputs ---
      - name: Merge photo-tools into web-tools dist
        run: |
          mkdir -p dist/photo-tools
          cp -r _photo-tools/web/dist/* dist/photo-tools/

      - name: Create .nojekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
