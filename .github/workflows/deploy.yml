name: Deploy to GitHub Pages & Aliyun Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Build (shared by both GitHub Pages & Aliyun Pages)
  # ============================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web-tools
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build web-tools
        run: pnpm build

      # --- Build photo-tools (from private repo) ---
      - name: Checkout photo-tools
        uses: actions/checkout@v4
        with:
          repository: EarthChen/photo-tools
          token: ${{ secrets.PHOTO_TOOLS_TOKEN }}
          path: _photo-tools

      - name: Install photo-tools dependencies
        run: pnpm install
        working-directory: _photo-tools

      - name: Build photo-tools
        run: pnpm exec vite build --base=/web-tools/photo-tools/
        working-directory: _photo-tools/web

      # --- Combine both build outputs ---
      - name: Merge photo-tools into web-tools dist
        run: |
          mkdir -p dist/photo-tools
          cp -r _photo-tools/web/dist/* dist/photo-tools/

      - name: Create .nojekyll
        run: touch dist/.nojekyll

      # Upload for GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # Upload for Aliyun Pages (shared dist)
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-aliyun
          path: './dist'

  # ============================================================
  # Job 2: Deploy to GitHub Pages
  # ============================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================
  # Job 3: Deploy to Aliyun ESA Pages
  # Reuses the same dist artifact from the build job.
  # ============================================================
  deploy-aliyun:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-aliyun
          path: './dist'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Login to Aliyun ESA
        env:
          ESA_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ESA_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: npx esa-cli login

      - name: Deploy to Aliyun Pages
        run: npx esa-cli deploy --name web-tools-aliyun-pages --assets ./dist -e production
